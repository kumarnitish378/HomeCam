name: Build HomeCam APK

# What runs when:
#   push to main / pull request  -> test + build a dev APK (artifact only)
#   "Run workflow" button         -> dev build, or a NEW RELEASE when you pick a bump/version
#   push a tag like v1.2.0        -> build + create release v1.2.0 with the APK
#   release published by hand     -> build + attach the APK to that release
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      bump:
        description: "Create a release? Pick which part of the version to raise (none = just build)"
        type: choice
        options: [ none, patch, minor, major ]
        default: none
      version:
        description: "Or type an exact version, e.g. 1.2.0 (overrides bump)"
        type: string
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true
      notes:
        description: "Extra release notes (optional; GitHub adds the commit list automatically)"
        type: string
        required: false
        default: ""
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decide version and release mode
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IN_BUMP: ${{ inputs.bump }}
          IN_VERSION: ${{ inputs.version }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          MODE=dev            # dev | create | upload
          TAG=""
          PRERELEASE=true

          if [ "$EVENT" = "release" ]; then
            MODE=upload
            TAG="$RELEASE_TAG"
          elif [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            MODE=create
            TAG="$REF_NAME"
            # A release made in the GitHub UI also pushes its tag: just attach the APK to it
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then MODE=upload; fi
          elif [ "$EVENT" = "workflow_dispatch" ] && { [ -n "$IN_VERSION" ] || [ "$IN_BUMP" != "none" ]; }; then
            MODE=create
            PRERELEASE="$IN_PRERELEASE"
            if [ -n "$IN_VERSION" ]; then
              TAG="v${IN_VERSION#v}"
            else
              # Newest vX.Y.Z among existing releases, then raise the chosen part
              LATEST=$(gh api "repos/$REPO/releases?per_page=100" --jq '.[].tag_name' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
              LATEST="${LATEST:-v0.0.0}"
              IFS=. read -r MA MI PA <<< "${LATEST#v}"
              case "$IN_BUMP" in
                major) MA=$((MA + 1)); MI=0; PA=0 ;;
                minor) MI=$((MI + 1)); PA=0 ;;
                patch) PA=$((PA + 1)) ;;
              esac
              TAG="v$MA.$MI.$PA"
              echo "Latest release $LATEST -> $TAG"
            fi
          fi

          if [ "$MODE" = "dev" ]; then
            VERSION="0.0.0-dev.${{ github.run_number }}"
          else
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag must look like v1.2.3 (got '$TAG')"
              exit 1
            fi
            VERSION="${TAG#v}"
            if [ "$MODE" = "create" ] && gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "::error::Release $TAG already exists. Pick another version."
              exit 1
            fi
            if [ "$MODE" = "create" ] && [ "$EVENT" = "workflow_dispatch" ] \
               && gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists. Pick another version."
              exit 1
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Plan: mode=$MODE tag=${TAG:-none} version=$VERSION prerelease=$PRERELEASE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          touch .env
          if [ ! -f "debug.keystore" ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              # Fixed key from repo secret: every build has the same signature,
              # so new APKs install as updates over old ones.
              echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            elif [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; signing with a throwaway key (APK will not update over older builds)."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Refuse to release with a throwaway key
        if: steps.plan.outputs.mode != 'dev'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not set. A release signed with a throwaway key could not update existing installs."
            exit 1
          fi

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:testDebugUnitTest
          else
            gradle :app:testDebugUnitTest
          fi

      - name: Build Debug APK
        run: |
          # versionName from the plan (release tag v1.2.3 -> 1.2.3, else 0.0.0-dev.<run>).
          # versionCode = run number, so it always increases and updates install cleanly.
          VERSION_NAME="${{ steps.plan.outputs.version }}"
          ARGS="-PappVersionName=$VERSION_NAME -PappVersionCode=${{ github.run_number }}"
          echo "Building HomeCam $VERSION_NAME (code ${{ github.run_number }})"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug $ARGS --stacktrace
          else
            gradle :app:assembleDebug $ARGS --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeCam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with the APK
        if: steps.plan.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          EXTRA_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          APK="HomeCam-$TAG.apk"
          cp app/build/outputs/apk/debug/*.apk "$APK"
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          {
            if [ -n "$EXTRA_NOTES" ]; then printf '%s\n\n' "$EXTRA_NOTES"; fi
            echo "## Install"
            echo "Download \`$APK\` below and open it on both phones."
            echo "Phones already on HomeCam can also update from inside the app (Check for updates)."
          } > "$NOTES_FILE"
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          # Someone may have created this release in the UI meanwhile: then just attach the APK
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "${{ github.repository }}"
            exit 0
          fi
          # Creates the tag on this commit if it doesn't exist (manual run),
          # or uses the pushed tag. GitHub adds the list of changes since the last release.
          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "HomeCam $TAG" \
            --notes-file "$NOTES_FILE" \
            --generate-notes \
            "${FLAGS[@]}"
          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/$APK" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach APK to Release
        if: steps.plan.outputs.mode == 'upload'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          cp app/build/outputs/apk/debug/*.apk "HomeCam-$TAG.apk"
          gh release upload "$TAG" "HomeCam-$TAG.apk" --clobber --repo "${{ github.repository }}"
