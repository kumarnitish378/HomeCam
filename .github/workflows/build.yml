name: Build HomeCam APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          touch .env
          if [ ! -f "debug.keystore" ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              # Fixed key from repo secret: every build has the same signature,
              # so new APKs install as updates over old ones.
              echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            elif [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; signing with a throwaway key (APK will not update over older builds)."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:testDebugUnitTest
          else
            gradle :app:testDebugUnitTest
          fi

      - name: Build Debug APK
        run: |
          # Version: release tag v1.2.3 -> versionName 1.2.3; other builds -> 0.0.0-dev.<run>.
          # versionCode = run number, so it always increases and updates install cleanly.
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION_NAME="${{ github.event.release.tag_name }}"
            VERSION_NAME="${VERSION_NAME#v}"
          else
            VERSION_NAME="0.0.0-dev.${{ github.run_number }}"
          fi
          ARGS="-PappVersionName=$VERSION_NAME -PappVersionCode=${{ github.run_number }}"
          echo "Building HomeCam $VERSION_NAME (code ${{ github.run_number }})"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug $ARGS --stacktrace
          else
            gradle :app:assembleDebug $ARGS --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeCam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk "HomeCam-${{ github.event.release.tag_name }}.apk"
          gh release upload "${{ github.event.release.tag_name }}" "HomeCam-${{ github.event.release.tag_name }}.apk" --clobber --repo "${{ github.repository }}"
